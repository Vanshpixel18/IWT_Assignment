<svg xmlns="http://www.w3.org/2000/svg" width="400" height="80" viewBox="0 0 400 80">
  <!-- Background banner rectangle -->
  <rect width="400" height="80" rx="10" fill="#2f6fa7" />
  
  <!-- Circle Shape (Home Hotspot target) -->
  <circle cx="50" cy="40" r="30" fill="#4a90e2" stroke="#ffffff" stroke-width="3" />
  <text x="50" y="45" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HOME</text>
  
  <!-- Main Title Text -->
  <text x="195" y="48" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">IWT WEB PORTAL</text>
  
  <!-- Rectangle Shape (About Hotspot target) -->
  <rect x="310" y="15" width="75" height="50" rx="5" fill="#ffffff" stroke="#4a90e2" stroke-width="3" />
  <text x="347" y="45" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#2f6fa7" text-anchor="middle">ABOUT</text>
</svg>
