<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - IWT Academic Assignment Portal</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <!-- Centered container for login form -->
  <div class="login-wrapper">
    <div class="card login-box">
      
      <!-- Login Page Header -->
      <div class="login-header">
        <h1>College IWT Portal</h1>
        <p>5th Semester Assignment Login</p>
      </div>

      <!-- 
        LOGIN FORM:
        Submits via POST request to login.php.
        This handles session initialization and hit counter updates.
      -->
      <form action="login.php" method="POST">
        
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="e.g. Student" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="form-group">
          <input type="submit" value="Sign In" class="btn" style="width: 100%;">
        </div>

      </form>

      <p style="font-size: 12px; color: #888; text-align: center; margin-top: 15px;">
        <em>Note: Demo authentication (any username/password accepted).</em>
      </p>

    </div>
  </div>

</body>
</html>
